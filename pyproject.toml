[project]
name = "twonumorg"
version = "1.0.0"
requires-python = ">=3.14"
dependencies = [
    "Django[argon2]~=6.1.1",
    "psycopg~=3.3.6",
    "django-allauth[mfa,socialaccount]~=65.19.4",
    "fido2~=2.2.1",
    "django-widget-tweaks~=1.5.0",
    "Markdown~=3.10.2",
    "pygments~=2.21.0",
    "nh3~=0.3.6",
    "django-crispy-forms~=2.4",
    "django-environ~=0.14.0",
    "django-tz-detect~=0.5.0",
    "martor~=1.8.2",  # only for migrations
    "pillow~=12.3.0",
    "whitenoise[brotli]~=6.12.0",
    "gunicorn~=26.2.0",
    "uvicorn~=0.53.0",
    "django-cleanup~=9.0.0",
    "strip-markdown~=1.3",
    "django-cors-headers~=4.9.0",
    "django-avatar~=9.0.0",
    "django-minify-html~=1.14.0",
    "djangorestframework~=3.18.1",
    "djangorestframework-stubs~=3.18.1",
    "django-filter>=25.2",
    "drf-spectacular[sidecar]>=0.29.0",  # sidecar to self-host as much as possible
    "graphene-django>=3.2.3",
    "django-ipware~=7.0.1",
]
authors = [
  {name = "twonum", email = "two@twonum.org"},
]
maintainers = [
  {name = "twonum", email = "two@twonum.org"}
]
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = [
    "COPYING",
    "COPYING.CODE",
    "COPYING.CONTENT",
    "COPYING.GPLv3",
]

[dependency-groups]
dev = [
    "ruff>=0.16.8",
]

[tool.ruff]
line-length = 79
exclude = [
    ".venv",       # Common sense
    "migrations",  # Auto-generated by Django; don't mess with them
    "manage.py",   # Ditto; don't change Django-generated files
]

[tool.ruff.format]
quote-style = "double"
